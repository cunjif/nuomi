[workspace]
resolver = "2"
members = ["crates/nuomi-core", "crates/nuomi-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# async runtime & utilities
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# errors
thiserror = "2"
anyhow = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# persistence
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ids & time
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# http client (providers)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
bytes = "1"

# outbound webhook signing (bots-telemetry-m1)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# misc
keyring = "3"

# dev-dependencies
tempfile = "3"
wiremock = "0.6"

[profile.dev]
opt-level = 1
