[package]
name = "nuomi-core"
description = "Nuomi agent harness kernel: domain, plugin kernel, providers, orchestrator, store, evolution"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
reqwest.workspace = true
bytes.workspace = true
keyring.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
# PTY long sessions for interactive CLI agents (harness-research P1):
# wezterm's portable-pty — Windows ConPTY / macOS & Linux unix PTYs.
portable-pty = "0.9"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
# Enables tokio::time::pause / #[tokio::test(start_paused = true)] for
# deterministic DeliveryReadiness window tests (no real sleeps in CI).
tokio = { workspace = true, features = ["test-util"] }
