<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nuomi · 糯米</title>
    <script>
      // FOUC defense: resolve the theme before first paint. Priority must stay
      // in lockstep with resolveInitialTheme() in src/lib/store/uiStore.ts:
      // localStorage("nuomi.theme") -> prefers-color-scheme -> chalkboard-dark.
      (function () {
        try {
          var stored = localStorage.getItem("nuomi.theme");
          var prefersLight =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme =
            stored === "paper-light" || stored === "grid-notebook" ||
            stored === "chalkboard-dark" || stored === "high-contrast"
              ? stored
              : stored === "light"
                ? "paper-light"
                : stored === "dark"
                  ? "chalkboard-dark"
                  : prefersLight
                    ? "paper-light"
                    : "chalkboard-dark";
          var root = document.documentElement;
          root.dataset.theme = theme;
          if (theme === "chalkboard-dark" || theme === "high-contrast") {
            root.classList.add("dark");
          }
        } catch (e) {
          // Storage unavailable — keep UA default (light vars on :root).
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
